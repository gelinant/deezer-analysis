[project]
name = "deezer-analysis"
version = "0.1.0"
description = "Collecte et analyse de donnees de l'API publique Deezer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
